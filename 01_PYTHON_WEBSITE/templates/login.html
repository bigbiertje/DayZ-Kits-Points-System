
{% extends "base.html" %}
{% block content %}
<div class="card">
  <h1>Login</h1>
  <form method="post">
    <label>Username</label>
    <input name="username" required>
    <label>Password</label>
    <input type="password" name="password" required>
    <button>Login</button>
  </form>
  <hr>
  <p>Or use account login:</p>
  <p>
    <a class="btn" href="{{ url_for('auth_steam') }}">Login with Steam</a>
    <a class="btn" href="{{ url_for('auth_discord') }}">Login with Discord</a>
  </p>
</div>
{% endblock %}
